<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRM practice quiz</title>
<meta name="description" content="ESCP MiM · Human Resource Management · 35 exam-style questions on chapters 1–3, including real past-exam questions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --surface: #f5f5f7;
  --card: #ffffff;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: #e5e5ea;
  --accent: #1d4ed8;
  --accent-soft: #e8eefc;
  --on-accent: #ffffff;
  --good: #15803d;
  --good-soft: #e8f6ed;
  --bad: #c62828;
  --bad-soft: #fdecec;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --card: #1c1c1e;
    --text: #f5f5f7;
    --muted: #a1a1a6;
    --line: #38383a;
    --accent: #6b8ff5;
    --accent-soft: #1d2a4d;
    --on-accent: #0b1020;
    --good: #4ade80;
    --good-soft: #12301e;
    --bad: #f87171;
    --bad-soft: #3a1616;
    --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
header h1 { font-size: clamp(26px, 5vw, 34px); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 6px; font-weight: 700; }
header p { margin: 0; color: var(--muted); font-size: 15px; }

.tabs { display: flex; gap: 4px; margin: 28px 0 20px; padding: 4px; background: var(--surface); border-radius: 14px; }
.tab {
  flex: 1 1 0; min-width: 0; min-height: 44px; padding: 8px 10px;
  border: 0; border-radius: 10px; background: transparent; color: var(--muted);
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; line-height: 1.2;
}
.tab span { display: block; font-size: 12px; font-weight: 500; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
@media (prefers-color-scheme: dark) { .tab[aria-selected="true"] { background: #3a3a3c; } }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: var(--shadow); }
.meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; color: var(--muted); font-weight: 500; }
.meta strong { color: var(--text); font-weight: 600; }
.bar { height: 6px; background: var(--surface); border-radius: 99px; overflow: hidden; margin: 10px 0 22px; }
.bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }

.question { font-size: 19px; font-weight: 600; line-height: 1.4; margin: 0 0 18px; letter-spacing: -0.01em; }
.question:focus { outline: none; }
.src { display: inline-block; margin: 0 0 10px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; letter-spacing: .01em; background: var(--surface); color: var(--muted); }
.src.real { background: var(--accent); color: var(--on-accent); }
.options { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.opt {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 52px;
  padding: 12px 14px; text-align: left; font: inherit; font-size: 16px; color: var(--text);
  background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.opt:hover:not([aria-disabled="true"]) { border-color: var(--accent); background: var(--accent-soft); }
.opt .key {
  flex: 0 0 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 700; margin-top: -1px;
}
.opt[aria-disabled="true"] { cursor: default; }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.correct .key { background: var(--good); color: var(--bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: var(--bg); }
.opt.dim { opacity: .55; }

.feedback { margin-top: 18px; padding: 14px 16px; border-radius: 14px; font-size: 15px; line-height: 1.55; border-left: 4px solid; }
.feedback.good { background: var(--good-soft); border-color: var(--good); }
.feedback.bad { background: var(--bad-soft); border-color: var(--bad); }
.feedback b { display: block; margin-bottom: 2px; }
[hidden] { display: none !important; }

.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; }
.btn {
  min-height: 44px; padding: 10px 20px; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 600;
  cursor: pointer; border: 1.5px solid var(--line); background: var(--card); color: var(--text);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:not(:disabled):hover { filter: brightness(.96); }

.dots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; justify-content: center; }
.dot {
  width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface);
  color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
}
.dot.right { background: var(--good); border-color: var(--good); color: var(--bg); }
.dot.miss { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.dot.current { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }

.end { text-align: center; padding: 16px 0 8px; }
.end .label { color: var(--muted); font-size: 15px; font-weight: 500; margin: 0; }
.end .big { font-size: clamp(64px, 16vw, 96px); font-weight: 700; letter-spacing: -0.04em; line-height: 1; margin: 10px 0 8px; }
.end .msg { margin: 0 0 24px; color: var(--muted); }
.end .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

.hint { margin-top: 18px; text-align: center; font-size: 13px; color: var(--muted); }
kbd { font: inherit; font-size: 12px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tab:focus-visible, .opt:focus-visible, .btn:focus-visible, .dot:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

@media (max-width: 520px) {
  .wrap { padding-top: 28px; }
  .card { padding: 18px 16px; border-radius: 18px; }
  .question { font-size: 18px; }
  .tab { font-size: 13px; padding: 8px 6px; }
  .nav .btn { flex: 1 1 0; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>HRM practice quiz · Chapters 1–3</h1>
    <p>ESCP MiM · Human Resource Management · 35 exam-style questions</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Chapters" id="tabs"></nav>

  <main class="card" id="panel" role="tabpanel">
    <section id="quiz">
      <div class="meta"><span id="count"></span><strong id="score" aria-live="polite"></strong></div>
      <div class="bar" aria-hidden="true"><div id="fill"></div></div>
      <p class="src" id="src"></p>
      <h2 class="question" id="question" tabindex="-1"></h2>
      <ul class="options" id="options"></ul>
      <div class="feedback" id="feedback" role="status" hidden></div>
      <div class="nav">
        <button class="btn" id="prev" type="button">Previous</button>
        <button class="btn primary" id="next" type="button">Next</button>
      </div>
      <div class="dots" id="dots" aria-label="Jump to question"></div>
    </section>

    <section class="end" id="end" hidden>
      <p class="label" id="endLabel"></p>
      <p class="big" id="endScore"></p>
      <p class="msg" id="endMsg"></p>
      <div class="actions">
        <button class="btn" id="review" type="button">Review answers</button>
        <button class="btn primary" id="restart" type="button">Restart this chapter</button>
      </div>
    </section>
  </main>

  <p class="hint">Keyboard: <kbd>A</kbd>–<kbd>D</kbd> or <kbd>1</kbd>–<kbd>4</kbd> to answer · <kbd>←</kbd> <kbd>→</kbd> to move</p>
</div>

<script>
const DATA = [{"ch": "Introduction to HRM", "qs": [["According to the resource-based view of the firm, HRM can contribute to developing:", ["Rare resources", "Generic resources", "Intrinsic resources", "None of the answers are correct"], 0, "RBV: advantage comes from resources that are valuable, rare, hard to imitate and organised (VRIO). Generic resources are available to every firm, so they cannot set a firm apart.", "exam"], ["Which is false about signalling theory and HRM?", ["Signals sent by HRM need to be aligned with the individual goals of the supervisor.", "HRM conveys certain information to employees about which individual characteristics and behaviors are worthwhile to the organization.", "Signals help organizations to create a specific climate within the organization.", "In recruitment processes, HRM uses university degrees as signals of candidate quality."], 0, "HR signals must be aligned with the organisation's goals, not with one supervisor's personal goals. The other three are textbook uses of signalling: telling employees what is valued, building a climate, degrees as quality signals.", "prof"], ["Which statement describes the idea behind the contingent approach to HRM?", ["The environmental and organizational context shape HRM.", "There is a best solution concerning HRM which applies to all organizations.", "HRM underlie normative isomorphism which form them.", "Only large organizations can develop effective HRM systems."], 0, "Contingent (best-fit) approach: the right HRM depends on the context. Option B is the opposite view, the universal 'best practice' approach.", "prof"], ["A contemporary trend in HRM is a shift in responsibility for HR activities ______.", ["from HR specialists to senior management", "from HR specialists to union representatives", "from HR specialists to line managers", "from senior managers to HR specialists"], 2, "Line managers now carry out much of HR day to day (appraisals, selection interviews, development), with HR specialists advising.", "prof"], ["A plant manager installs brighter lighting on one assembly line. Output rises on that line, and also on a comparison line where nothing changed. The most likely explanation is ______.", ["a delayed lighting effect", "the Hawthorne effect", "a reliability problem", "the halo effect"], 1, "As in the Western Electric studies: output rose in both groups whatever was changed. Being observed and receiving attention raises effort. Halo is a rating error, not a productivity effect.", "new"], ["Lena's firm designed a team-bonus scheme. It adds value and no rival has one yet, but competitors could set up the same scheme cheaply within months. In VRIO terms, the scheme fails the test of ______.", ["value", "rarity", "organization", "imitability"], 3, "It is valuable and, for now, rare, but it is not costly to imitate, so any advantage is temporary. Bundles of practices that reinforce each other are much harder to copy than a single scheme.", "new"], ["According to the resource-based view, which of these is most likely to give a firm a sustained competitive advantage?", ["a single best practice", "a star hired from a rival", "general skills, e.g. Excel", "a bundle of HR practices"], 3, "A bundle of practices that reinforce each other is socially complex and causally ambiguous, so it is hard to copy. A single practice is easy to imitate, a star can be poached again, and general skills are portable.", "new"], ["The labour process critique argues that HR practices raise performance partly by ______.", ["intensifying work", "raising pay", "improving selection", "None of the answers are correct"], 0, "The critique: part of the performance gain comes from making people work harder, at a cost to their well-being (Green & McIntosh, 2001).", "new"], ["In the European Working Conditions Survey (Avgoustaki & Frankort, 2019), which factor is the stronger predictor of stress, lower satisfaction and worse career outcomes?", ["overtime", "work intensity", "job discretion", "length of commute"], 1, "Both overtime and work intensity hurt, but work intensity is the stronger predictor. Discretion over how and when to work softens the harm without removing it.", "new"], ["Anna works late because her bonus depends on it. Ben works late because he enjoys learning. According to self-determination theory, ______.", ["both gain well-being", "only Anna gains well-being", "only Ben gains well-being", "neither is affected"], 2, "Extrinsically driven effort (Anna, the bonus) lowers well-being; intrinsically driven effort (Ben, learning) raises it.", "new"]]}, {"ch": "Sustainable HRM", "qs": [["Which of the following statements about sustainable HRM practices is true?", ["Sustainable HRM practices mostly fail in aligning different corporate goals associated with sustainability, i.e., financial, ecological and social targets.", "Sustainable HRM practices may vary across organizations, however, they are likely to be located in the areas of training/development, work-family balance, diversity promotion, as well as occupational health and safety.", "Sustainable HRM practices only address stakeholders inside of the company while external stakeholders are neglected.", "Sustainable HRM have become mandatory for organizations in 2021."], 1, "Practices vary by firm but cluster in training, work-family balance, diversity and health and safety. Sustainable HRM aims to align financial, social and ecological goals, inside and outside the firm, and it is voluntary.", "prof"], ["______ is defined as HRM strategies and practices that achieve financial, social and ecological goals, inside and outside the firm, over the long term, while controlling for side effects.", ["Corporate social responsibility", "Sustainable development", "Sustainable HRM", "Strategic HRM"], 2, "Ehnert et al. (2016). CSR is the European Commission's definition about firms in general; sustainable development is Brundtland's definition about society.", "new"], ["Development that meets the needs of the present without compromising the ability of future generations to meet their own needs is the definition of ______.", ["sustainable development", "corporate social responsibility", "sustainable HRM", "None of the answers are correct"], 0, "Brundtland Commission (1987). It is about society as a whole, not about one firm or its HR practices.", "new"], ["According to the European Commission (2001), companies integrate social and environmental concerns into their operations and their dealings with stakeholders on a ______ basis.", ["mandatory", "contractual", "voluntary", "temporary"], 2, "CSR goes beyond what the law requires: it is voluntary by definition.", "new"], ["Which of the following is NOT one of the grand challenges in management listed by George et al. (2016)?", ["climate change", "ageing societies", "tax competition", "gender inequality"], 2, "The four challenges in the course: climate change, ageing societies, the digital workforce and gender inequality.", "new"], ["Marta's employer guarantees that staff can ignore work emails after 7 pm without any penalty. Which type of flexibility is this?", ["flextime", "telework", "time off", "connectivity"], 3, "Five types: where (telework), how much (part-time), when (flextime), connectivity (right to disconnect) and time off (leave). Ignoring emails after hours is control over connectivity.", "new"], ["A firm offers generous flexible-working policies and every manager approves requests, but few employees make requests because they fear looking less committed. In the implementation chain, where does it break down?", ["availability", "access", "use", "None of the answers are correct"], 2, "Chain: availability → access → use → outcomes. The policy exists (availability) and requests are approved (access), but stigma and fear of career penalties stop people from using it (Kossek et al., 2023).", "new"], ["When flexible working is implemented, who are the main gatekeepers between the policy and its actual use?", ["HR specialists", "supervisors", "trade unions", "top management"], 1, "Supervisors decide in practice who gets access and whether using flexibility is penalised.", "new"], ["In the CTrip experiment (Bloom et al., 2015), employees randomly assigned to work from home ______.", ["performed worse but were happier", "performed better and were promoted more", "performed better but were promoted less", "performed the same but quit more"], 2, "Home workers were 13% more productive, took fewer breaks and sick days and were happier, but their promotion rate was halved: 'out of sight, out of mind'.", "new"], ["Why did CTrip assign working from home by birthday (even or odd) among the volunteers?", ["to reward senior staff", "to make the groups comparable", "to cut office costs", "to comply with local labour law"], 1, "Random assignment makes the two groups alike on average, so differences in outcomes can be attributed to working from home and not to who chose it.", "new"]]}, {"ch": "Recruitment and selection", "qs": [["Chloé is a hiring manager who often administers a skills test during an applicant's first interview. The applicant scores well and Chloé invites him back for a second interview, where she administers the same test. This time the results are different. Chloé is reviewing ______.", ["the usefulness of the test", "the mechanics of the test", "the reliability of the test", "the purpose of the test"], 2, "Reliability = consistent measurement: the same person should get the same score across sessions or raters.", "exam"], ["Layla finds that a particular test that her company is using during the selection process to measure problem-solving skills does not accurately predict an applicant's ability on the job to solve problems. This test is ______.", ["unreliable", "not valid", "impractical", "none of the answers are correct"], 1, "Validity = measuring the right thing, i.e. predicting job performance. Reliability is only about consistency of scores.", "exam"], ["What is false about generic human capital", ["It refers to knowledge that is useful to a particular employer", "It is the technical, regulatory, or customer knowledge of a particular industry", "It stems from managerial relationships at work", "All the answers are correct"], 3, "All three statements are false: A describes company-specific human capital, B industry human capital, C relationship human capital. Generic (general) human capital is useful to many employers, so it is the most portable. Here 'All the answers are correct' means that all three statements are false.", "exam"], ["According to Groysberg, McLean and Nohria (2006), which type of human capital is the least portable?", ["General", "Industry", "Relationship", "Organization-specific"], 3, "Company-specific skills (routines, culture, systems) create value only in the current firm, so they lose the most when a person moves. General skills are the most portable.", "prof"], ["Paul is ranked first among analysts, has 20 years in the industry and can move to a rival together with his team. His human capital is mainly ______.", ["general and strategic", "industry and relationship", "company-specific", "None of the answers are correct"], 1, "Class exercise on star analysts: 20 years in one industry = industry human capital; moving with his team keeps the relationships = relationship human capital. Lloyd, who worked on rare in-house IT systems, was the company-specific case.", "new"], ["Bidwell (2011) studied 5,260 bank employees. Compared with internal promotees in the same jobs, external hires were ______.", ["rated higher and paid more", "rated lower and paid less", "rated lower and paid more", "rated higher and paid less"], 2, "External hires got lower performance ratings for two years and exited more, yet they were better educated and paid more.", "new"], ["What is the most common type of selection procedure?", ["interviews", "personality tests", "integrity tests", "cognitive ability tests"], 0, "Interviews are used almost everywhere, even though unstructured interviews are prone to biases.", "exam"], ["Which of the following criteria would not be valid to select a cashier for a supermarket:", ["They demonstrate ethical behaviour", "They have good communication skills", "They show outstanding team-management skills", "They show outstanding work reliability and responsibility"], 2, "A cashier does not manage a team, so that criterion is not relevant to the job: using it would contaminate the selection (validity).", "exam"], ["Which of the following is NOT an advantage associated with informal recruitment?", ["speed", "lower cost", "administrative convenience", "avoidance of discrimination"], 3, "Informal recruitment (word of mouth, referrals) is fast, cheap and convenient, but it reproduces the existing workforce, so it can discriminate.", "prof"], ["Which of the following is NOT an identified type of selection bias:", ["Halo effect", "Fundamental attribution error", "Competence excellence", "Similar to me"], 2, "Halo, fundamental attribution error and similar-to-me are known rating biases. 'Competence excellence' is invented.", "prof"], ["Tom has exactly the skills the job requires but does not share the company's values. Based on person–job and person–organisation fit, Tom is most likely to ______.", ["perform poorly and leave", "perform well but leave", "perform poorly but stay", "perform well and stay"], 1, "Strong P–J fit predicts performance; weak P–O fit predicts lower commitment and turnover: 'capable but may leave' (Kristof, 1996).", "new"], ["Cloning is a potential drawback of what approach to recruitment and selection?", ["Person-organisation fit", "Validity", "Reliability", "Interviews"], 0, "Hiring for fit with the culture can turn into hiring people similar to those already there ('similar-to-me'), which reduces diversity.", "quiz"], ["Employees hired through referrals stay longer, partly because the friend who referred them told them what the job is like day to day. This explanation is the ______.", ["individual difference hypothesis", "signalling hypothesis", "similar-to-me hypothesis", "realistic information hypothesis"], 3, "Two explanations for why informal sources work: realistic information (candidates know what to expect) and individual difference (referrers pre-screen).", "new"], ["The same actress received different personality scores from an AI interview tool when she wore glasses or sat in front of a bookshelf. Following the course, the tool is mainly ______.", ["impractical", "unacceptable", "deficient", "unreliable"], 3, "Retorio case, used in class for reliability: the same person should get the same score. The scores are also contaminated by irrelevant features, but the defining problem is the inconsistency.", "new"], ["An AI tool rates candidates only on their facial expressions and tone of voice, leaving out the actual skills the job requires. The measure is ______.", ["contaminated", "deficient", "unreliable", "impractical"], 1, "Deficient = it leaves out relevant parts of the job. Contaminated = it includes irrelevant influences. Both are validity problems.", "new"]]}];

(function () {
  "use strict";
  const LETTERS = ["A", "B", "C", "D"];
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  const state = DATA.map((c) => ({ answers: new Array(c.qs.length).fill(null), cur: 0, done: false }));
  let ch = 0;

  /* Tabs */
  const tabs = DATA.map((c, i) => {
    const b = el("button", "tab");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.id = "tab" + (i + 1);
    b.setAttribute("aria-controls", "panel");
    b.appendChild(document.createTextNode("Chapter " + (i + 1)));
    b.appendChild(el("span", null, c.ch));
    b.addEventListener("click", () => { location.hash = "ch" + (i + 1); });
    $("tabs").appendChild(b);
    return b;
  });

  function chapterFromHash() {
    const m = /^#ch([1-9]\d*)$/.exec(location.hash);
    const i = m ? parseInt(m[1], 10) - 1 : 0;
    return i >= 0 && i < DATA.length ? i : 0;
  }

  function stats(s) {
    let right = 0, answered = 0;
    s.answers.forEach((a, i) => {
      if (a == null) return;
      answered++;
      if (a === DATA[ch].qs[i][2]) right++;
    });
    return { right, answered };
  }

  function render(focusQuestion) {
    const c = DATA[ch], s = state[ch];
    tabs.forEach((t, i) => {
      t.setAttribute("aria-selected", i === ch ? "true" : "false");
      t.tabIndex = i === ch ? 0 : -1;
    });
    $("panel").setAttribute("aria-labelledby", "tab" + (ch + 1));
    document.title = "HRM practice quiz · Chapter " + (ch + 1);

    const { right, answered } = stats(s);
    $("quiz").hidden = s.done;
    $("end").hidden = !s.done;

    if (s.done) {
      const total = c.qs.length;
      $("endLabel").textContent = "Chapter " + (ch + 1) + " · " + c.ch;
      $("endScore").textContent = right + "/" + total;
      const pct = right / total;
      $("endMsg").textContent = pct >= 0.8 ? "Excellent. You are ready for this chapter."
        : pct >= 0.6 ? "Good. Review the questions you missed."
        : "Worth another pass: review the explanations and try again.";
      $("review").focus({ preventScroll: true });
      return;
    }

    const q = c.qs[s.cur], chosen = s.answers[s.cur], locked = chosen != null, correct = q[2];
    $("count").textContent = "Question " + (s.cur + 1) + " of " + c.qs.length;
    $("score").textContent = "Score " + right + "/" + answered;
    $("fill").style.width = (answered / c.qs.length * 100) + "%";
    const SRC = { exam: "Past exam · resit 2024 & mocks 2025", prof: "Professor's example question", quiz: "Class quiz", new: "New · exam style" };
    $("src").textContent = SRC[q[4]] || "";
    $("src").className = "src" + (q[4] === "new" ? "" : " real");
    $("question").textContent = q[0];

    const list = $("options");
    list.replaceChildren();
    q[1].forEach((text, i) => {
      const li = el("li");
      const b = el("button", "opt");
      b.type = "button";
      b.appendChild(el("span", "key", LETTERS[i]));
      b.appendChild(el("span", null, text));
      if (locked) {
        b.setAttribute("aria-disabled", "true");
        if (i === correct) b.classList.add("correct");
        else if (i === chosen) b.classList.add("wrong");
        else b.classList.add("dim");
        if (i === chosen) b.setAttribute("aria-label", LETTERS[i] + ". " + text + " (your answer" + (i === correct ? ", correct)" : ", wrong)"));
        else if (i === correct) b.setAttribute("aria-label", LETTERS[i] + ". " + text + " (correct answer)");
      }
      b.addEventListener("click", () => answer(i));
      li.appendChild(b);
      list.appendChild(li);
    });

    const fb = $("feedback");
    fb.replaceChildren();
    if (locked) {
      const ok = chosen === correct;
      fb.className = "feedback " + (ok ? "good" : "bad");
      fb.appendChild(el("b", null, ok ? "Correct." : "Not quite: the answer is " + LETTERS[correct] + "."));
      fb.appendChild(document.createTextNode(q[3]));
      fb.hidden = false;
    } else {
      fb.hidden = true;
    }

    $("prev").disabled = s.cur === 0;
    const last = s.cur === c.qs.length - 1;
    $("next").textContent = last ? "See score" : "Next";
    $("next").disabled = !locked;

    const dots = $("dots");
    dots.replaceChildren();
    c.qs.forEach((qq, i) => {
      const d = el("button", "dot", String(i + 1));
      d.type = "button";
      const a = s.answers[i];
      let status = "not answered";
      if (a != null) { d.classList.add(a === qq[2] ? "right" : "miss"); status = a === qq[2] ? "correct" : "wrong"; }
      if (i === s.cur) { d.classList.add("current"); d.setAttribute("aria-current", "step"); }
      d.setAttribute("aria-label", "Question " + (i + 1) + ", " + status);
      d.addEventListener("click", () => go(i));
      dots.appendChild(d);
    });

    if (focusQuestion) $("question").focus({ preventScroll: true });
  }

  function answer(i) {
    const s = state[ch];
    if (s.done || s.answers[s.cur] != null) return;
    s.answers[s.cur] = i;
    render(false);
    $("next").focus({ preventScroll: true });
  }

  function go(i) {
    const s = state[ch];
    if (i < 0 || i >= DATA[ch].qs.length) return;
    s.cur = i;
    render(true);
  }

  function next() {
    const s = state[ch];
    if (s.answers[s.cur] == null) return;
    if (s.cur === DATA[ch].qs.length - 1) { s.done = true; render(false); }
    else go(s.cur + 1);
  }

  $("prev").addEventListener("click", () => go(state[ch].cur - 1));
  $("next").addEventListener("click", next);
  $("review").addEventListener("click", () => { const s = state[ch]; s.done = false; s.cur = 0; render(true); });
  $("restart").addEventListener("click", () => {
    state[ch] = { answers: new Array(DATA[ch].qs.length).fill(null), cur: 0, done: false };
    render(true);
  });

  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    const s = state[ch];
    if (s.done) return;
    const k = e.key.toLowerCase();
    const map = { a: 0, b: 1, c: 2, d: 3, "1": 0, "2": 1, "3": 2, "4": 3 };
    if (k in map) { e.preventDefault(); answer(map[k]); }
    else if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(s.cur - 1); }
  });

  window.addEventListener("hashchange", () => { ch = chapterFromHash(); render(false); });
  ch = chapterFromHash();
  render(false);
})();
</script>
</body>
</html>
